services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odal}
      POSTGRES_DB: ${POSTGRES_DB:-odal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odal} -d ${POSTGRES_DB:-odal}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-odal}:${POSTGRES_PASSWORD:-odal}@db:5432/${POSTGRES_DB:-odal}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
